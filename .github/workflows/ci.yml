name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push makes the run for the previous one pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The adapter crate itself is plain `no_std` library code, so it can be built,
  # linted and documented on the host for both toolchains.
  #
  # NOTE: `--all-features` is deliberately never used here: `embassy-boot`
  # `compile_error!`s when `defmt` and `log` are enabled together, so the two
  # logging back ends have to be checked as separate permutations.
  host:
    name: crate (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `nightly` is only here to catch new lints early; if it goes red because
        # of clippy churn, pin a working nightly in a `rust-toolchain.toml`.
        rust: [stable, nightly]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Clippy (log)
        run: cargo clippy --all-targets --locked --features log -- -D warnings

      - name: Clippy (defmt)
        run: cargo clippy --all-targets --locked --features defmt -- -D warnings

      # Cargo cannot say "these two features are exclusive", `build.rs` does, so
      # assert that it keeps doing so.
      - name: log and defmt are mutually exclusive
        if: matrix.rust == 'stable'
        run: |
          set +e
          output="$(cargo check --locked --all-features 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo '::error::cargo check --all-features succeeded; the log/defmt exclusion in build.rs is broken' >&2
            exit 1
          fi
          case "$output" in
            *'mutually exclusive'*) ;;
            *)
              echo '::error::cargo check --all-features failed, but not with the feature exclusion message' >&2
              exit 1
              ;;
          esac

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked --lib

      # The partition maps are the one piece of geometry both examples and CI
      # depend on; validate it against the requirements embassy-boot checks at
      # runtime.
      - name: Partition maps
        run: python3 tools/check_partitions.py

  # The chip list lives in `examples/chips.rs`; publishing it as a job output
  # keeps this workflow from keeping a second copy of it in sync.
  chips:
    name: Chip list
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: list
        run: |
          parts="$(tools/build_matrix.sh --list | awk 'NR>1 { printf "\"%s\",", $1 }' | sed 's/,$//')"
          printf 'matrix={"chip":[%s]}\n' "$parts" >>"$GITHUB_OUTPUT"

  # One job per part: builds the bootloader and the application for the target
  # that part needs and checks both against the partition map they were linked
  # against (the limits come from the `__bootloader_*` symbols in the ELF, so no
  # numbers are duplicated here).
  firmware:
    name: ${{ matrix.chip }}
    needs: chips
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.chips.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          # `rust-src` is needed by `build-std = ["core"]`; the CH32V3 parts are
          # built from the JSON target spec next to the examples.
          components: rust-src

      # Provides the `llvm-*` tools used by `tools/check_size.sh`. The component
      # was renamed from `llvm-tools-preview`, so try both names.
      - name: Install llvm-tools
        run: rustup component add llvm-tools || rustup component add llvm-tools-preview

      # Only the downloaded registry and git checkouts are cached: every part is
      # a different feature set, so caching `target/` would store 20 near-identical
      # trees without hitting them again.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      # `--locked` keeps the git dependency on `ch32-hal` pinned to the revision
      # in the examples' `Cargo.lock`, so a new upstream commit cannot break CI.
      # Builds both transports; parts without a `-usb` partition map only get
      # the serial one (skipped by the script itself).
      - name: Build and check
        env:
          CARGO_ARGS: --locked
        run: tools/build_matrix.sh --chip ${{ matrix.chip }} --bin-dir dist/${{ matrix.chip }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.chip }}
          path: dist/${{ matrix.chip }}
          if-no-files-found: error

  # Lints the examples for the default part only: the chip matrix above proves
  # they build everywhere, and the lints do not depend on the part.
  examples-lint:
    name: examples lint (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [bootloader, application]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/${{ matrix.example }} -> target
          key: lint-${{ matrix.example }}

      - name: Format
        working-directory: examples/${{ matrix.example }}
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: examples/${{ matrix.example }}
        run: cargo clippy --release --locked -- -D warnings

      # The default part (CH32V305RBT6) supports the USB DFU transport, and the
      # `transport-usb`/`usb-dfu` code is cfg-ed out of the default build, so it
      # needs its own lint permutation.
      - name: Clippy (usb)
        working-directory: examples/${{ matrix.example }}
        run: |
          case "${{ matrix.example }}" in
            bootloader) features=ch32v305rbt6,transport-usb ;;
            application) features=ch32v305rbt6,usb-dfu ;;
          esac
          cargo clippy --release --locked --no-default-features \
            --features "$features" -- -D warnings
