[workspace]

[package]
name = "bootloader"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "embassy-boot bootloader example for the WCH CH32V2/CH32V3 parts"

[[bin]]
name = "bootloader"
harness = false

[dependencies]
ch32-hal = { git = "https://github.com/ch32-rs/ch32-hal.git", default-features = false, features = [
    "rt",
    # `ch32-hal` does not compile without this feature today (its usb modules use
    # `embassy-time` unconditionally). No embassy executor or time driver is used
    # here, the bootloader is plain blocking code.
    "embassy",
] }
embassy-boot-ch32 = { path = "../.." }
embassy-sync = "0.8.0"
qingke-rt = "0.7"

# Only pulled in by the `transport-usb` build; the serial bootloader links none
# of this and stays plain blocking code.
embassy-futures = { version = "0.1.2", optional = true }
embassy-usb = { version = "0.6.0", default-features = false, optional = true }
embassy-usb-dfu = { version = "0.3.0", default-features = false, features = [
    "dfu",
], optional = true }
# Only pulled in by the `transport-can` build: `ch32-hal` re-exports its CAN
# driver but not the `embedded-can` blocking traits it implements.
embedded-can = { version = "0.4.1", optional = true }

[features]
# Exactly one chip feature has to be enabled: `build.rs` resolves it to a
# partition map in `../../partition-map` and to the target the part needs, and
# forwards it to the matching `ch32-hal` part feature.
#
# Exactly one `transport-*` feature has to be enabled as well; `transport-usb`
# and `transport-can` are only available on the parts that have the controller
# (and enough flash), see the README.
#
# Build another part with
# `cargo build --release --no-default-features --features <part> --target <target>`,
# see the table in the README.
default = ["ch32v305rbt6", "transport-uart"]

# Receives the image over the USART1 console.
transport-uart = []
# Serves the image over USB DFU 1.1 (`dfu-util`).
transport-usb = ["dep:embassy-futures", "dep:embassy-usb", "dep:embassy-usb-dfu"]
# Receives the image over classic CAN at 1 Mbit/s, speaking the protocol of
# `docs/can-update-protocol.md` (host side: `tools/can_update.py`).
transport-can = ["dep:embedded-can"]
# Uses the CAN1 remap 1 pins PB8 (RX) / PB9 (TX) instead of the default PA11
# (RX) / PA12 (TX), which the USB controller shares. Only valid together with
# `transport-can`.
can-pb8-pb9 = []

# CH32V203, riscv32imc-unknown-none-elf
ch32v203c8t6 = ["ch32-hal/ch32v203c8t6"]
ch32v203c8u6 = ["ch32-hal/ch32v203c8u6"]
ch32v203f8p6 = ["ch32-hal/ch32v203f8p6"]
ch32v203f8u6 = ["ch32-hal/ch32v203f8u6"]
ch32v203g8r6 = ["ch32-hal/ch32v203g8r6"]
ch32v203k8t6 = ["ch32-hal/ch32v203k8t6"]
# CH32V208, riscv32imc-unknown-none-elf
ch32v208cbu6 = ["ch32-hal/ch32v208cbu6"]
ch32v208gbu6 = ["ch32-hal/ch32v208gbu6"]
ch32v208rbt6 = ["ch32-hal/ch32v208rbt6"]
ch32v208wbu6 = ["ch32-hal/ch32v208wbu6"]
# CH32V303, riscv32imfc-unknown-none-elf
ch32v303cbt6 = ["ch32-hal/ch32v303cbt6"]
ch32v303rbt6 = ["ch32-hal/ch32v303rbt6"]
ch32v303rct6 = ["ch32-hal/ch32v303rct6"]
ch32v303vct6 = ["ch32-hal/ch32v303vct6"]
# CH32V305, riscv32imfc-unknown-none-elf
ch32v305fbp6 = ["ch32-hal/ch32v305fbp6"]
ch32v305gbu6 = ["ch32-hal/ch32v305gbu6"]
ch32v305rbt6 = ["ch32-hal/ch32v305rbt6"]
# CH32V307, riscv32imfc-unknown-none-elf
ch32v307rct6 = ["ch32-hal/ch32v307rct6"]
ch32v307vct6 = ["ch32-hal/ch32v307vct6"]
ch32v307wcu6 = ["ch32-hal/ch32v307wcu6"]

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "z"
overflow-checks = false
strip = false
