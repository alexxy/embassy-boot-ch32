[workspace]

[package]
name = "application-ch32v305"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Example application for the CH32V305RBT6 embassy-boot example"

[[bin]]
name = "application-ch32v305"
harness = false

[dependencies]
ch32-hal = { git = "https://github.com/ch32-rs/ch32-hal.git", default-features = false, features = [
    "ch32v305rbt6",
    "rt",
    "embassy",
    "time-driver-tim2",
] }
embassy-boot-ch32 = { path = "../.." }
embassy-executor = { version = "0.10.0", features = [
    "platform-spin",
    "executor-thread",
] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embedded-storage = "0.3.1"
panic-halt = "1.0"
qingke-rt = "0.7"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "z"
overflow-checks = false
strip = false
