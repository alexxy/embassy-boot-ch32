[workspace]

[package]
name = "application"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Example embassy application for the embassy-boot CH32 example"

[[bin]]
name = "application"
harness = false

[dependencies]
ch32-hal = { git = "https://github.com/ch32-rs/ch32-hal.git", default-features = false, features = [
    "rt",
    "embassy",
    # `any` lets `ch32-hal` pick the first general purpose timer the selected
    # part actually has (TIM5, TIM4, TIM3 or TIM2).
    "time-driver-any",
] }
embassy-boot-ch32 = { path = "../.." }
embassy-executor = { version = "0.10.0", features = [
    "platform-spin",
    "executor-thread",
] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"

# Only pulled in by the `usb-dfu` feature; the plain application links none of
# this.
embassy-usb = { version = "0.6.0", default-features = false, optional = true }
embassy-usb-dfu = { version = "0.3.0", default-features = false, features = [
    "application",
], optional = true }
embedded-storage = "0.3.1"
panic-halt = "1.0"
qingke-rt = "0.7"

[features]
# Exactly one chip feature has to be enabled: `build.rs` resolves it to a
# partition map in `../../partition-map` and to the target the part needs, and
# forwards it to the matching `ch32-hal` part feature.
#
# An application built with `usb-dfu` exposes the DFU runtime interface on the
# part's USB controller, so `dfu-util -e` switches the board into the USB
# bootloader; it is linked against the same `-usb` partition map as a
# `transport-usb` bootloader and is only available on the parts listed in the
# README.
#
# Build another part with
# `cargo build --release --no-default-features --features <part> --target <target>`,
# see the table in the README.
default = ["ch32v305rbt6"]

# DFU runtime interface over USB (`dfu-util -e` to enter the bootloader).
usb-dfu = ["dep:embassy-usb", "dep:embassy-usb-dfu"]

# CH32V203, riscv32imc-unknown-none-elf
ch32v203c8t6 = ["ch32-hal/ch32v203c8t6"]
ch32v203c8u6 = ["ch32-hal/ch32v203c8u6"]
ch32v203f8p6 = ["ch32-hal/ch32v203f8p6"]
ch32v203f8u6 = ["ch32-hal/ch32v203f8u6"]
ch32v203g8r6 = ["ch32-hal/ch32v203g8r6"]
ch32v203k8t6 = ["ch32-hal/ch32v203k8t6"]
# CH32V208, riscv32imc-unknown-none-elf
ch32v208cbu6 = ["ch32-hal/ch32v208cbu6"]
ch32v208gbu6 = ["ch32-hal/ch32v208gbu6"]
ch32v208rbt6 = ["ch32-hal/ch32v208rbt6"]
ch32v208wbu6 = ["ch32-hal/ch32v208wbu6"]
# CH32V303, riscv32imfc-unknown-none-elf
ch32v303cbt6 = ["ch32-hal/ch32v303cbt6"]
ch32v303rbt6 = ["ch32-hal/ch32v303rbt6"]
ch32v303rct6 = ["ch32-hal/ch32v303rct6"]
ch32v303vct6 = ["ch32-hal/ch32v303vct6"]
# CH32V305, riscv32imfc-unknown-none-elf
ch32v305fbp6 = ["ch32-hal/ch32v305fbp6"]
ch32v305gbu6 = ["ch32-hal/ch32v305gbu6"]
ch32v305rbt6 = ["ch32-hal/ch32v305rbt6"]
# CH32V307, riscv32imfc-unknown-none-elf
ch32v307rct6 = ["ch32-hal/ch32v307rct6"]
ch32v307vct6 = ["ch32-hal/ch32v307vct6"]
ch32v307wcu6 = ["ch32-hal/ch32v307wcu6"]

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "z"
overflow-checks = false
strip = false
